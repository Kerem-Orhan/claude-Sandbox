<title>Team Channel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-screen ops log. Roster strip on top, live message stream, composer pinned at the bottom. */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --fg:#17201d; --muted:#5d6b66; --line:#d9e0dd;
  --accent:#0f6b5c; --accent-soft:#e1efeb; --dm:#7a4b00; --dm-soft:#fbf0dc;
  --body:"Atkinson Hyperlegible",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --panel:#161e1b; --fg:#e4ece9; --muted:#8fa29b; --line:#26322e;
  --accent:#5fc7b2; --accent-soft:#16302a; --dm:#e7b45c; --dm-soft:#2e2414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --panel:#161e1b; --fg:#e4ece9; --muted:#8fa29b; --line:#26322e;
  --accent:#5fc7b2; --accent-soft:#16302a; --dm:#e7b45c; --dm-soft:#2e2414; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}
.app{height:100%;display:flex;flex-direction:column;max-width:900px;margin:0 auto;padding-inline:16px;box-sizing:border-box}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;padding-block:14px 10px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0;text-wrap:balance}
.status{font:12px var(--mono);color:var(--muted)}
.status b{color:var(--accent);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.filters button{font:12px var(--mono);padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.filters button:focus-visible,.composer :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.roster{display:flex;flex-wrap:wrap;gap:6px;padding-block:10px;border-bottom:1px solid var(--line);font:12px var(--mono)}
.chip{padding:2px 8px;border-radius:4px;background:var(--panel);border:1px solid var(--line);white-space:nowrap}
.chip small{color:var(--muted)}
#log{flex:1;overflow-y:auto;padding-block:8px;min-height:0}
.msg{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:6px 8px;border-radius:6px}
.msg + .msg{margin-top:2px}
.msg.dm{background:var(--dm-soft)}
.msg.grp{background:var(--accent-soft)}
.msg.me{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.who .to.g{color:var(--accent)}
.chip.g{border-color:var(--accent);color:var(--accent)}
.time{font:11px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;padding-top:3px}
.who{font:600 13px var(--mono)}
.who .to{color:var(--dm);font-weight:400}
.who .h{color:var(--muted);font-weight:400}
.text{grid-column:2;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.empty{color:var(--muted);text-align:center;padding:40px 8px}
.composer{display:flex;gap:8px;padding-block:10px 14px;border-top:1px solid var(--line)}
.composer input{flex:1;min-width:0;font:15px var(--body);padding:9px 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.composer button{font:600 14px var(--body);padding:9px 16px;border-radius:6px;border:0;background:var(--accent);color:var(--bg);cursor:pointer}
.composer button:disabled{opacity:.5;cursor:default}
.note{font:12px var(--mono);color:var(--muted);padding-bottom:8px}
</style>

<div class="app">
  <header>
    <h1>Team Channel</h1>
    <span class="status" id="status">connecting…</span>
    <div class="filters" role="group" aria-label="Show">
      <button id="f-all" aria-pressed="true">All</button>
      <button id="f-board" aria-pressed="false">Board</button>
      <button id="f-dm" aria-pressed="false">DMs &amp; groups</button>
      <button id="f-me" aria-pressed="false">For you <span id="me-n"></span></button>
    </div>
  </header>
  <div class="roster" id="roster"><span class="chip"><small>Roster appears once the team registers.</small></span></div>
  <div id="log" aria-live="polite"><div class="empty">No messages yet. Board posts and direct messages between teammates show up here the moment they're sent.</div></div>
  <form class="composer" id="form">
    <input id="msg" autocomplete="off" placeholder="Post to the board as you…" maxlength="2000">
    <button id="send" type="submit">Post</button>
  </form>
  <div class="note" id="note" hidden></div>
</div>

<script>
const $ = id => document.getElementById(id);
let filter = "all", docs = [], roster = {}, groups = {};

for (const [id, f] of [["f-all","all"],["f-board","board"],["f-dm","dm"],["f-me","me"]]) {
  $(id).onclick = () => {
    filter = f;
    for (const b of document.querySelectorAll(".filters button")) b.setAttribute("aria-pressed", b.id === id);
    render();
  };
}

const fmt = ts => new Date(ts).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", second:"2-digit"});
const nameOf = h => roster[h] || h;

function render() {
  const log = $("log");
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 60;
  const mine = docs.filter(d => d.to === "you");
  $("me-n").textContent = mine.length ? "(" + mine.length + ")" : "";
  const shown = filter === "me" ? mine : docs.filter(d => filter === "all" || (filter === "dm") === (d.to && d.to !== "all"));
  if (!shown.length) {
    log.innerHTML = '<div class="empty">' + (docs.length ? "Nothing in this view yet." :
      "No messages yet. Board posts and direct messages between teammates show up here the moment they're sent.") + "</div>";
    return;
  }
  log.replaceChildren(...shown.map(d => {
    const el = document.createElement("div");
    const dm = d.to && d.to !== "all";
    const grp = dm && d.to.startsWith("group:");
    el.className = "msg" + (d.to === "you" ? " me" : grp ? " grp" : dm ? " dm" : "");
    const t = document.createElement("div"); t.className = "time"; t.textContent = fmt(d.ts);
    const w = document.createElement("div"); w.className = "who";
    w.append(d.name || nameOf(d.from));
    if (d.from && d.from !== "you") { const h = document.createElement("span"); h.className = "h"; h.textContent = " @" + d.from; w.append(h); }
    if (dm) {
      const to = document.createElement("span"); to.className = "to" + (grp ? " g" : "");
      to.textContent = grp ? "  → #" + d.to.slice(6) + " (group)" : "  → " + (d.to === "you" ? "You" : nameOf(d.to)) + " (DM)";
      w.append(to);
    }
    const x = document.createElement("div"); x.className = "text"; x.textContent = d.text || "";
    el.append(t, w, x);
    return el;
  }));
  if (atBottom) log.scrollTop = log.scrollHeight;
}

function renderRoster() {
  const hs = Object.keys(roster);
  if (!hs.length) return;
  const people = hs.map(h => {
    const c = document.createElement("span"); c.className = "chip";
    c.append(roster[h] + " "); const s = document.createElement("small"); s.textContent = "@" + h; c.append(s);
    return c;
  });
  const gs = Object.keys(groups).map(g => {
    const c = document.createElement("span"); c.className = "chip g";
    c.append("#" + g + " "); const s = document.createElement("small");
    s.textContent = (groups[g].members || []).map(nameOf).join(", "); c.append(s);
    return c;
  });
  $("roster").replaceChildren(...people, ...gs);
}

(async () => {
  const db = await claude.use("db");
  if (!db) { $("status").textContent = "live feed unavailable in this view"; $("form").hidden = true; return; }
  db.doc("meta/roster").onSnapshot(s => { roster = (s.exists && s.data().names) || {}; renderRoster(); render(); });
  db.collection("groups").onSnapshot(s => {
    groups = {}; for (const d of s.docs) groups[d.id] = d.data();
    renderRoster(); render();
  });
  db.collection("messages").orderBy("ts", "desc").limit(500).onSnapshot(snap => {
    docs = snap.docs.map(d => d.data()).reverse();
    $("status").innerHTML = "<b>● live</b> · " + docs.length + " messages";
    render();
  }, e => { $("status").textContent = "feed stopped (" + e.code + "). Reload to reconnect."; });

  $("form").onsubmit = async ev => {
    ev.preventDefault();
    const text = $("msg").value.trim();
    if (!text) return;
    $("send").disabled = true;
    try {
      const ts = Date.now();
      await db.collection("messages").doc(ts + "-you").set({ts, from: "you", name: "You", to: "all", text});
      $("msg").value = "";
    } catch (e) {
      $("note").hidden = false;
      $("note").textContent = e.code === "invalid_argument" ? "You can read this channel but not post to it." : "Couldn't post (" + e.code + "). Try again.";
    } finally { $("send").disabled = false; }
  };
})();
</script>
